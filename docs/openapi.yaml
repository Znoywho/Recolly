        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Timetable]
      operationId: createSubjects
      summary: T4 · Save subjects in bulk (after OCR review or manual entry)
      description: |
        Each subject also creates a weekly recurring event (`kind = class`, `source = ocr | manual`)
        so it appears in E1 and is used by the scheduler and the projected wake time.
        `replace_existing = true` deletes the old subjects and their events first.
      x-task-ids: [R15, R16]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubjectBulkCreate' }
      responses:
        '201':
          description: Saved subjects.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /timetable/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Timetable]
      operationId: updateSubject
      summary: T5 · Edit a subject
      description: The linked recurring event is updated too (and marked `pending` if it was synced).
      x-task-ids: [R15]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubjectUpdate' }
      responses:
        '200':
          description: Updated subject.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Timetable]
      operationId: deleteSubject
      summary: T6 · Delete a subject
      description: Also deletes its recurring event (and the Google copy on next sync).
      x-task-ids: [R15]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────────── Events ───────────────────────────────
  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: E1 · List events in a range
      description: |
        Recurring events are expanded into instances inside `[from, to)`; each instance has the
        series `id` plus `occurrence_start`. Max range 62 days. Edits and deletes act on the series.
      x-task-ids: [R28]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/EventKind' }
        - name: source
          in: query
          schema: { $ref: '#/components/schemas/EventSource' }
      responses:
        '200':
          description: Events sorted by start.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Events]
      operationId: createEvent
      summary: E2 · Create an event
      x-task-ids: [R28]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Created (`source = manual`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /events/{id}:
    parameters:
