openapi: 3.1.0
info:
  title: Recolly API
  version: 1.0.0-draft.2
  summary: Backend contract for the Recolly Android app (FastAPI + PostgreSQL).
  description: |
    Machine-readable contract for Recolly (task R01). `docs/api-v1.md` is the
    human-readable overview; **this file is the source of truth** for request and
    response shapes. Status: **DRAFT** — must be reviewed by the whole team before
    it is frozen. Never change an endpoint's shape without flagging it for the team.

    ## Conventions

    | Item | Rule |
    |---|---|
    | Base URL | `https://<host>/api/v1` (local: `http://localhost:8765/api/v1`) |
    | Format | JSON, except uploads (`multipart/form-data`) |
    | Auth | `Authorization: Bearer <access_token>` unless the operation says `security: []` |
    | Datetime | ISO 8601 with offset, e.g. `2026-10-19T08:00:00+07:00`. Responses use the user's `timezone` |
    | Date / time | `YYYY-MM-DD` / `HH:MM` (24h, no seconds) |
    | Recurrence | RFC 5545 RRULE without the `RRULE:` prefix |
    | IDs | UUID v4 |
    | Naming | `snake_case` fields, kebab-case paths |
    | Pagination | `?limit=&cursor=` → `{ "items": [...], "next_cursor": "..." \| null }` |
    | Partial update | `PATCH` sends only the fields to change (at least one) |
    | Nullable | Response fields are always present; "nullable" means the value may be `null` |

    ## Errors

    Every non-2xx response except 422 has the body `{ "detail": "...", "code": "..." }`.
    422 is FastAPI's default validation body (`HTTPValidationError`).
    Flutter should branch on `code`, never on `detail` (free text, may change).

    | Code | HTTP | Meaning |
    |---|---|---|
    | `TOKEN_INVALID` / `TOKEN_EXPIRED` | 401 | Access token missing, malformed or expired |
    | `REFRESH_TOKEN_INVALID` | 401 | Refresh token unknown, revoked or already used |
    | `GOOGLE_CODE_INVALID` | 400 | `server_auth_code` rejected by Google |
    | `GOOGLE_SCOPE_MISSING` | 403 | Calendar scope not granted |
    | `CALENDAR_NOT_CONNECTED` | 409 | Calendar operation without a connection |
    | `FORBIDDEN` | 403 | Resource belongs to another user |
    | `<RESOURCE>_NOT_FOUND` | 404 | e.g. `TODO_NOT_FOUND`, `EVENT_NOT_FOUND`, `HEALTH_PROFILE_NOT_FOUND` |
    | `RANGE_TOO_LARGE` | 400 | `from`/`to` range longer than the endpoint allows |
    | `INVALID_RANGE` | 400 | `to` before `from`, or end before start |
    | `SLEEP_LOG_OVERLAP` | 409 | New/edited sleep log overlaps another log |
    | `SCREEN_TRACKING_DISABLED` | 403 | Screen upload while `screen_tracking_enabled = false` |
    | `RMEQ_REQUIRED` | 422 | C1 / H2: MSFsc cannot be computed (irregular schedule or 7 school days) and no `rmeq_score` |
    | `SUGGESTION_NOT_FOUND` / `SUGGESTION_EXPIRED` | 404 / 410 | Scheduler suggestion unknown / older than 1 h |
    | `UNSUPPORTED_IMAGE` / `UNSUPPORTED_AUDIO` | 400 | Wrong file type |
    | `AUDIO_TOO_LONG` | 400 | Recording longer than 60 s |
    | `FILE_TOO_LARGE` | 413 | Upload over the size limit |
    | `RATE_LIMITED` | 429 | Too many AI requests (OCR, voice, Gemini) |
    | `OCR_UNAVAILABLE` / `ASR_UNAVAILABLE` / `GOOGLE_UNAVAILABLE` | 503 | AI model or Google API down |

    OCR job failure codes (inside `OcrJob.error`, not HTTP errors):
    `OCR_NO_TABLE_FOUND`, `OCR_LOW_QUALITY`, `OCR_MODEL_ERROR`.

    ## Sleep model (Module 2)

    Implements the personalised two-process model from the Recolly sleep research
    (Skeldon & Dijk 2025; Van Dongen et al. 2007; Roenneberg MCTQ):

    ```
    screen on/off ──► HMM ──► sleep/wake ──┐
    MCTQ / rMEQ ────► chronotype prior ────┼─► 2PM + Bayes ──► predicted KSS ──► CP-SAT ──► Google Calendar
    KSS check-ins ─────────────────────────┘     ▲ updated on every check-in
    ```

    * **Process S** (sleep pressure `H`, 0–1): awake `dH/dt = (μ − H)/χw`, asleep `dH/dt = −H/χs`.
    * **Process C**: `C(t) = cos(2π(t − φ)/24)`; `φ` (hour of the circadian peak) **is the chronotype**.
    * Thresholds `H±(t) = H0± + a·C(t)`. **Alertness** `A(t) = H⁺(t) − H(t)`; `A ≤ 0` means "should be asleep".
    * **KSS** (Karolinska Sleepiness Scale, 1 = very alert … 9 = fighting sleep): `KSS = 7.5 − 9·A + ε`.
    * Personal parameters `θ = (φ, χw)` have a grid posterior (φ: 96 × 0.25 h, χw: 12–26 h step 0.5),
      updated from KSS check-ins. Other constants are fixed: χs 4.2 h, μ 1, H0⁺ 0.67, H0⁻ 0.17, a 0.12.
    * Priors: population φ ~ N(17.4 h, 1.5 h); questionnaire φ ~ N(φ_MCTQ + 0.9 h, 1.0 h);
      χw ~ N(18.2 h, 2.5 h). The +0.9 h corrects the systematic ~50–55 min early bias of MCTQ found
      in the research (synthetic data; recalibrate on real data).
    * `alertness_score = round(100 · (9 − kss_pred) / 8)`, clamped to 0–100 — the UI-friendly number.

    **Course-project scope (draft 2.1).** The app ships with the questionnaire path only:
    MCTQ / rMEQ → `chronotype` shown as an animal (`lion` / `bear` / `wolf`) plus a separate
    `sleep_concern` flag (`dolphin` = fragmented sleep, not a chronotype) → the 2PM runs on a
    **typical week** built from the questionnaire sleep times (night before a school day = school-day
    times, other nights = free-day times). Screen inference (P1–P4), KSS check-ins (K1–K3), Bayes
    personalisation (B1, B2) and H9 stay in the contract but are marked `x-phase: later`.

    This is a scheduling aid, **not** a medical or diagnostic tool.
  contact:
    name: Backend — Member 1 (Lê Thiên Hạo)
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8765/api/v1
    description: Local (docker compose / uvicorn)
  - url: https://{host}/api/v1
    description: Deployed
    variables:
      host:
        default: api.recolly.example
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Google sign-in and backend JWTs.
  - name: User
    description: Account profile.
  - name: Chronotype & profile
    description: Onboarding questionnaire (MCTQ / rMEQ / sleep quality) → lion / bear / wolf + dolphin flag, and the baseline sleep profile.
  - name: Sleep logs
    description: Manual and inferred sleep episodes, sleep debt.
  - name: Screen & sleep inference
    description: Android screen on/off events → HMM → inferred sleep episodes.
  - name: KSS check-ins
    description: Self-reported sleepiness used to personalise the model (Bayes).
  - name: Biorhythm
    description: Process S/C curves, predicted KSS, golden hours and the personal model.
  - name: OCR
    description: Timetable photo → subjects (Vintern, async jobs).
  - name: Timetable
    description: Weekly class slots; each creates a recurring class event.
  - name: Events
    description: Calendar blocks (classes, study sessions, bedtime, manual, Google).
  - name: Todos
    description: Tasks and deadlines for the scheduler.
  - name: Voice
    description: Vietnamese speech → todo draft (PhoWhisper + Gemini).
  - name: Scheduler
    description: CP-SAT study planning on the predicted KSS curve.
  - name: Google Calendar
    description: OAuth connection, one-/two-way sync and conflicts.
  - name: Reminders
    description: Reminder settings, FCM devices and motivation quotes.
  - name: Home
    description: Aggregated data for the Home screen.
  - name: System
    description: Operational endpoints.

paths:
  # ───────────────────────────── Auth ─────────────────────────────
  /auth/google:
    post:
      tags: [Auth]
      operationId: signInWithGoogle
      summary: A1 · Sign in with Google
      description: |
        Flutter uses `google_sign_in` with `serverClientId`, requests the scopes
        `openid email profile https://www.googleapis.com/auth/calendar.events`, and sends the
        one-time `serverAuthCode`. The backend exchanges it, stores the Google refresh token
        encrypted, and issues its own JWTs. `is_new_user = true` → show onboarding (R55).
      x-task-ids: [R07, R08]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleSignInRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: A2 · Get a new access token
      description: Refresh tokens rotate — the old one is invalid after use.
      x-task-ids: [R08]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: A3 · Revoke a refresh token
      x-task-ids: [R08]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── User ─────────────────────────────
  /users/me:
    get:
      tags: [User]
      operationId: getMe
      summary: U1 · Current user
      x-task-ids: [R61]
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [User]
      operationId: updateMe
      summary: U2 · Update profile
      x-task-ids: [R61]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [User]
      operationId: deleteMe
      summary: U3 · Delete account and all data
      description: Deletes every row owned by the user (including raw screen events) and revokes the Google tokens.
      x-task-ids: [R61]
      responses:
        '204': { description: Account deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── Chronotype & profile ───────────────────────
  /chronotype/assess:
    post:
      tags: [Chronotype & profile]
      operationId: assessChronotype
      summary: C1 · Score the questionnaire without saving
      description: |
        Onboarding result card: scores the questionnaire and returns the animal, the dolphin flag,
        the natural sleep window and the **typical week** energy curve **before** the user confirms
        the profile with H2. Nothing is stored. Send `school_onset_shift_minutes` for the "what if I
        slept earlier" slider (phi is kept, only the school-night bedtime moves).

        * MCTQ: `SD = end − onset`, `MS = onset + SD/2`, `SDweek = (SDw·WD + SDf·(7 − WD))/7`,
          `MSFsc = MSF − (SDf − SDweek)/2` if `SDf > SDw` else `MSF`, `SJL = |MSF − MSW|`.
        * Animal from MSFsc: `< 04:00` lion, `04:00–06:00` bear, `≥ 06:00` wolf (provisional cut-offs).
          From rMEQ only: `≥ 18` lion, `12–17` bear, `≤ 11` wolf.
        * MCTQ is used when `regular_schedule` is true and `work_days` ≤ 6; otherwise `rmeq_score` is
          required (`422 RMEQ_REQUIRED`).
        * `sleep_concern`: `dolphin` when F1 or F2 is `3+` nights and F3 is `>3m`; `watch` when `3+`
          but shorter. Screening flag only, never a diagnosis; it does not change the animal.
        * `phi_prior_hours = φ(MSFsc) + 0.9 h` (bias correction, see the model notes in `info`).
        * If `work_days` is omitted, it is the number of distinct weekdays in the saved timetable (fallback 5).
      x-task-ids: [R18, R55]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChronotypeAssessmentRequest' }
      responses:
        '200':
          description: Scored questionnaire.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChronotypeAssessment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Validation error, or `RMEQ_REQUIRED` when MSFsc cannot be computed and no `rmeq_score` was sent.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/HTTPValidationError' }
                  - { $ref: '#/components/schemas/Error' }

  /health-profile:
    get:
      tags: [Chronotype & profile]
      operationId: getHealthProfile
      summary: H1 · Get sleep profile
      description: Returns `404 HEALTH_PROFILE_NOT_FOUND` if onboarding is not finished.
      x-task-ids: [R17, R55]
      responses:
        '200':
          description: The sleep profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Chronotype & profile]
      operationId: putHealthProfile
      summary: H2 · Create or replace sleep profile
      description: |
        Chronotype source priority: `mctq` > `rmeq` > `self_report` (the `chronotype` field).
        When `mctq` or `rmeq_score` is given, the server computes `chronotype` and ignores the
        value sent. Changing the questionnaire re-seeds the model prior (B1) but keeps KSS history.
      x-task-ids: [R17, R55]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthProfileInput' }
      responses:
        '200':
          description: Saved profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ─────────────────────────── Sleep logs ───────────────────────────
  /sleep-logs:
    get:
      tags: [Sleep logs]
      operationId: listSleepLogs
      summary: H3 · List sleep logs
      description: Logs whose `wake_at` date (user timezone) is in `[from, to]`, newest first. Max range 92 days.
      x-task-ids: [R17, R34]
      parameters:
        - name: from
          in: query
          description: Inclusive start date. Default `to − 13 days`.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive end date. Default today.
          schema: { type: string, format: date }
        - name: source
          in: query
          schema: { $ref: '#/components/schemas/SleepSource' }
        - name: confirmed
          in: query
          description: '`false` → only inferred logs waiting for the user to confirm.'
          schema: { type: boolean }
      responses:
        '200':
          description: Sleep logs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SleepLogList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Sleep logs]
      operationId: createSleepLog
      summary: H4 · Add a sleep log (manual)
      description: |
        Creates a `source = manual`, `confirmed = true` log. An overlapping **unconfirmed** inferred
        log is replaced; any other overlap returns `409 SLEEP_LOG_OVERLAP`. Naps are allowed (they
        lower Process S like any sleep).
      x-task-ids: [R17, R34]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SleepLogCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SleepLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sleep-logs/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Sleep logs]
      operationId: updateSleepLog
      summary: H5 · Edit a sleep log
      description: Editing an inferred log also sets `confirmed = true` (the user corrected it).
      x-task-ids: [R17, R34]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SleepLogUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SleepLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Sleep logs]
      operationId: deleteSleepLog
      summary: H6 · Delete a sleep log
      description: Deleting an inferred log marks that night as "user rejected" so inference does not recreate it.
      x-task-ids: [R17]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sleep-logs/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Sleep logs]
      operationId: confirmSleepLog
      summary: H9 · One-tap confirm of an inferred sleep log
      x-phase: later  # after the course project
      description: |
        Morning flow: "You slept 23:40–07:05 — correct?" → confirm (this endpoint) or edit (H5).
        The research showed sleep-measurement quality, not model complexity, is the bottleneck
        (KSS RMSE 0.75 with true sleep vs 0.98 with screen-inferred sleep), so confirmed logs are
        weighted as ground truth by the model. Idempotent.
      x-task-ids: [R17, R34]
      responses:
        '200':
          description: Confirmed log.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SleepLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sleep-debt:
    get:
      tags: [Sleep logs]
      operationId: getSleepDebt
      summary: H7 · Sleep debt and social jetlag summary
      x-task-ids: [R20, R35]
      parameters:
        - name: days
          in: query
          description: Number of days ending today.
          schema: { type: integer, minimum: 1, maximum: 30, default: 7 }
      responses:
        '200':
          description: Sleep debt summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SleepDebtSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────── Screen & sleep inference ─────────────────────
  /screen-events:
    post:
      tags: [Screen & sleep inference]
      operationId: uploadScreenEvents
      summary: P1 · Upload screen on/off events
      x-phase: later  # after the course project
      description: |
        Android only. Flutter reads `UsageStatsManager.queryEvents` (`SCREEN_INTERACTIVE` → `on`,
        `SCREEN_NON_INTERACTIVE` → `off`; needs the `PACKAGE_USAGE_STATS` permission) for
        `[window_start, window_end)` and uploads them — e.g. once each morning and on app open.
        The window tells the server which periods are covered: no events inside the window means
        "screen off", outside any uploaded window means "no data".

        Idempotent: events already stored (same `type` + `at`) are counted as `duplicates`.
        After a successful upload the server re-runs sleep inference for the affected nights in
        the background and creates/updates **unconfirmed** `screen_inferred` sleep logs.
      x-task-ids: [R17, R19]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreenEventBatch' }
      responses:
        '202':
          description: Accepted; inference queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreenEventBatchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Screen & sleep inference]
      operationId: deleteScreenEvents
      summary: P3 · Delete all raw screen data
      x-phase: later  # after the course project
      description: Privacy control. Removes raw events only; sleep logs already created are kept.
      x-task-ids: [R17]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /screen-events/summary:
    get:
      tags: [Screen & sleep inference]
      operationId: getScreenEventsSummary
      summary: P2 · How much screen data the server has
      x-phase: later  # after the course project
      x-task-ids: [R17]
      responses:
        '200':
          description: Coverage summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreenDataSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sleep-inference:
    post:
      tags: [Screen & sleep inference]
      operationId: runSleepInference
      summary: P4 · Run sleep inference now
      x-phase: later  # after the course project
      description: |
        Runs the two-state HMM {awake, asleep} on 5-minute screen bins for the requested nights and
        upserts unconfirmed `screen_inferred` sleep logs. Transition probabilities depend on time of
        day around the user's typical sleep window (from the current `φ` estimate); emissions are
        `P(on | asleep) = 0.01` and `P(on | awake)` = the user's daytime usage rate. Forward–backward
        gives `P(asleep)`; the main episode per night is where it is > 0.5.
        Confirmed or user-deleted nights are never overwritten. Max range 14 nights.
      x-task-ids: [R19]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SleepInferenceRequest' }
      responses:
        '200':
          description: Inference result per night.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SleepInferenceResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ─────────────────────────── KSS check-ins ───────────────────────────
  /kss-checkins:
    get:
      tags: [KSS check-ins]
      operationId: listKssCheckins
      summary: K1 · List KSS check-ins
      x-phase: later  # after the course project
      description: Check-ins with `recorded_at` date (user timezone) in `[from, to]`, newest first. Max range 92 days.
      x-task-ids: [R19, R59]
      parameters:
        - name: from
          in: query
          description: Inclusive start date. Default `to − 13 days`.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive end date. Default today.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Check-ins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KssCheckinList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [KSS check-ins]
      operationId: createKssCheckin
      summary: K2 · Record sleepiness (KSS 1–9)
      x-phase: later  # after the course project
      description: |
        Stores the check-in and synchronously updates the Bayes posterior of `(φ, χw)` (a 96 × 29 grid,
        a few ms). `checkin.predicted_kss` is what the model predicted **before** seeing this answer,
        so the UI can show "model expected 4, you said 6".
        `recorded_at` must not be in the future nor more than 24 h in the past.
        Check-ins made while the user is logged as asleep are stored but ignored by the model.
      x-task-ids: [R19, R59]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KssCheckinCreate' }
      responses:
        '201':
          description: Stored; model updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KssCheckinResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /kss-checkins/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      tags: [KSS check-ins]
      operationId: deleteKssCheckin
      summary: K3 · Delete a check-in
      x-phase: later  # after the course project
      description: The posterior is recomputed without it.
      x-task-ids: [R19]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Biorhythm ─────────────────────────────
  /biorhythm:
    get:
      tags: [Biorhythm]
      operationId: getBiorhythm
      summary: H8 · Process S/C curves, predicted KSS and golden hours
      description: |
        Sleep state per point: `observed` from sleep logs (past), `projected` for the future — the
        2PM free-run sleep, but waking no later than `first class − morning_prep_minutes`.
        Before any sleep log exists, sleep comes from the questionnaire **typical week**
        (`sleep_state = typical`, warning `TYPICAL_WEEK`); this is the default in the course project.
        KSS / alertness fields are `null` while asleep.

        * `peak_windows` ("golden hours"): awake runs ≥ 30 min where `kss_pred` ≤ that day's 25th
          percentile of awake points, excluding the first 30 min after waking (sleep inertia).
        * `low_windows`: awake runs ≥ 30 min where `kss_pred` ≥ that day's 75th percentile.

        Works without KSS data (population/questionnaire prior) — check `warnings`.
        Returns `404 HEALTH_PROFILE_NOT_FOUND` before onboarding.
      x-task-ids: [R18, R20, R59]
      parameters:
        - name: date
          in: query
          description: First day (user timezone). Default today.
          schema: { type: string, format: date }
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 7, default: 1 }
        - name: interval_minutes
          in: query
          schema: { type: integer, enum: [5, 15, 30, 60], default: 15 }
      responses:
        '200':
          description: Curves for the requested days.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Biorhythm' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /biorhythm/model:
    get:
      tags: [Biorhythm]
      operationId: getBiorhythmModel
      summary: B1 · Personal model parameters and learning progress
      x-phase: later  # after the course project
      x-task-ids: [R18, R19, R59]
      responses:
        '200':
          description: Current posterior and priors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BiorhythmModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /biorhythm/model/reset:
    post:
      tags: [Biorhythm]
      operationId: resetBiorhythmModel
      summary: B2 · Reset personalisation
      x-phase: later  # after the course project
      description: |
        Re-seeds the posterior from the chosen prior and ignores KSS check-ins recorded before now
        (they are kept for history). Use after a big routine change (new semester, travel).
      x-task-ids: [R19]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelResetRequest' }
      responses:
        '200':
          description: Reset model.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BiorhythmModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ─────────────────────────────── OCR ───────────────────────────────
  /ocr/timetable:
    post:
      tags: [OCR]
      operationId: uploadTimetableImage
      summary: T1 · Upload a timetable photo
      description: OCR (Vintern) runs asynchronously. Poll T2 about every 2 s.
      x-task-ids: [R09]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  contentMediaType: application/octet-stream
                  description: JPEG, PNG or HEIC, max 10 MB.
            encoding:
              image:
                contentType: image/jpeg, image/png, image/heic
      responses:
        '202':
          description: Job queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OcrJobCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /ocr/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [OCR]
      operationId: getOcrJob
      summary: T2 · OCR job status and parsed timetable
      description: When `status = failed`, `error` holds a code and Flutter shows the scan-failed screen (R62).
      x-task-ids: [R10, R11]
      responses:
        '200':
          description: Job state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OcrJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Timetable ─────────────────────────────
  /timetable:
    get:
      tags: [Timetable]
      operationId: listSubjects
      summary: T3 · List subjects
      x-task-ids: [R15]
      responses:
        '200':
          description: All subjects of the user.
          content:
