        todo_id: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
        google_event_id: abc123
        sync_status: synced
        occurrence_start: null
        created_at: '2026-10-19T08:00:00+07:00'
        updated_at: '2026-10-19T08:00:00+07:00'
    EventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Event' }

    # ─────────── Todos ───────────
    TodoInput:
      type: object
      required: [title]
      description: |
        `deadline_at` + `estimated_minutes` are needed for S1 to schedule it.
        `start_at`/`end_at` = optional fixed slot (`end_at > start_at`).
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/TodoCategory', default: other }
        priority: { $ref: '#/components/schemas/Priority', default: medium }
        deadline_at: { type: [string, 'null'], format: date-time }
        estimated_minutes: { type: [integer, 'null'], minimum: 1, maximum: 6000 }
        difficulty:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
          description: 1 easy … 5 hard. Hard tasks are placed in the lowest predicted KSS slots.
        start_at: { type: [string, 'null'], format: date-time }
        end_at: { type: [string, 'null'], format: date-time }
    TodoUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/TodoCategory' }
        status: { $ref: '#/components/schemas/TodoStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        deadline_at: { type: [string, 'null'], format: date-time }
        estimated_minutes: { type: [integer, 'null'], minimum: 1, maximum: 6000 }
        difficulty: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        start_at: { type: [string, 'null'], format: date-time }
        end_at: { type: [string, 'null'], format: date-time }
    Todo:
      type: object
      required: [id, title, description, category, status, priority, deadline_at, estimated_minutes,
                 difficulty, start_at, end_at, scheduled_minutes, completed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/TodoCategory' }
        status: { $ref: '#/components/schemas/TodoStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        deadline_at: { type: [string, 'null'], format: date-time }
        estimated_minutes: { type: [integer, 'null'] }
        difficulty: { type: [integer, 'null'] }
        start_at: { type: [string, 'null'], format: date-time }
        end_at: { type: [string, 'null'], format: date-time }
        scheduled_minutes:
          type: integer
          readOnly: true
          description: Minutes of study events already linked to this todo (progress vs `estimated_minutes`).
        completed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      example:
        id: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
        title: Bài tập lớn CTDL
        description: Chương 3–5
        category: assignment
        status: todo
        priority: high
        deadline_at: '2026-10-25T23:59:00+07:00'
        estimated_minutes: 240
        difficulty: 4
        start_at: null
        end_at: null
        scheduled_minutes: 90
        completed_at: null
        created_at: '2026-10-19T08:00:00+07:00'
        updated_at: '2026-10-19T08:00:00+07:00'
    TodoPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Todo' }
        next_cursor: { type: [string, 'null'] }

    # ─────────── Voice ───────────
    TodoDraft:
      type: object
      description: Parsed from speech; not saved until the user confirms with D2.
      required: [title, description, category, priority, deadline_at, estimated_minutes, difficulty]
      properties:
        title: { type: string }
        description: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/TodoCategory' }
        priority: { $ref: '#/components/schemas/Priority' }
        deadline_at: { type: [string, 'null'], format: date-time }
        estimated_minutes: { type: [integer, 'null'] }
        difficulty: { type: [integer, 'null'], minimum: 1, maximum: 5 }
    TranscribeResponse:
      type: object
      required: [transcript, todo_draft, parser]
      properties:
        transcript: { type: string }
        todo_draft:
          anyOf: [{ $ref: '#/components/schemas/TodoDraft' }, { type: 'null' }]
        parser: { type: string, enum: [gemini, rules], description: Which extractor produced the draft. }
      example:
        transcript: Thứ sáu nộp bài tập lớn cấu trúc dữ liệu
        todo_draft:
          title: Nộp bài tập lớn cấu trúc dữ liệu
          description: null
          category: assignment
          priority: medium
          deadline_at: '2026-10-23T23:59:00+07:00'
          estimated_minutes: null
          difficulty: null
        parser: gemini

    # ─────────── Scheduler ───────────
    ScheduleOptions:
      type: object
      description: Defaults follow the research setup (90-min blocks, ≥ 30-min breaks, sleep-inertia and pre-bed buffers).
      properties:
        max_study_minutes_per_day: { type: integer, minimum: 30, maximum: 720, default: 240 }
        block_minutes: { type: integer, minimum: 25, maximum: 180, default: 90 }
        min_block_minutes:
          type: integer
          minimum: 15
          maximum: 180
          default: 45
          description: Shortest block allowed when a todo's remaining time is less than `block_minutes`.
        min_break_minutes: { type: integer, minimum: 0, maximum: 120, default: 30 }
        wake_buffer_minutes: { type: integer, minimum: 0, maximum: 120, default: 30, description: No study right after waking (sleep inertia). }
        bed_buffer_minutes: { type: integer, minimum: 0, maximum: 180, default: 60, description: No study before recommended bedtime. }
        meal_windows:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/ClockWindow' }
          default:
            - { start: '11:30', end: '13:00' }
            - { start: '18:00', end: '19:00' }
        include_rest_blocks: { type: boolean, default: false, description: Also return `rest` blocks for the breaks between study blocks. }
        include_bedtime_blocks: { type: boolean, default: true, description: Also return one `bedtime` block per night at `recommended_sleep_at`. }
    ScheduleGenerateRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date, description: Inclusive. Max 14 days after `from`. }
        todo_ids:
          type: [array, 'null']
          items: { type: string, format: uuid }
        options: { $ref: '#/components/schemas/ScheduleOptions' }
    ScheduleBlock:
      type: object
      required: [index, kind, todo_id, title, start_at, end_at, predicted_kss, alertness_score]
      properties:
        index: { type: integer, description: Position used by S2 `block_indexes`. }
        kind: { type: string, enum: [study, rest, bedtime] }
        todo_id: { type: [string, 'null'], format: uuid }
        title: { type: string }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        predicted_kss: { type: [number, 'null'], description: Mean predicted KSS over the block; null for `bedtime`. }
        alertness_score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
    UnscheduledTodo:
      type: object
      required: [todo_id, reason, missing_minutes]
      properties:
        todo_id: { type: string, format: uuid }
        reason:
          type: string
          enum: [NOT_ENOUGH_TIME_BEFORE_DEADLINE, MISSING_DEADLINE, MISSING_ESTIMATE,
                 DEADLINE_PASSED, DAILY_LIMIT_REACHED, ALREADY_SCHEDULED]
        missing_minutes: { type: [integer, 'null'], description: Minutes that could not be placed. }
    ScheduleSuggestion:
      type: object
      required: [suggestion_id, expires_at, from, to, solver_status, blocks, unscheduled, stats, model]
      properties:
        suggestion_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        from: { type: string, format: date }
        to: { type: string, format: date }
        solver_status: { type: string, enum: [OPTIMAL, FEASIBLE, INFEASIBLE, MODEL_INVALID, UNKNOWN] }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ScheduleBlock' }
        unscheduled:
          type: array
          items: { $ref: '#/components/schemas/UnscheduledTodo' }
        stats:
          type: object
          required: [study_minutes, mean_predicted_kss, golden_hour_ratio, solve_ms]
          properties:
            study_minutes: { type: integer }
            mean_predicted_kss: { type: [number, 'null'] }
            golden_hour_ratio: { type: number, minimum: 0, maximum: 1, description: Share of study minutes inside peak windows. }
            solve_ms: { type: integer }
        model: { $ref: '#/components/schemas/ModelSummary' }
      example:
        suggestion_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        expires_at: '2026-10-22T10:00:00+07:00'
        from: '2026-10-22'
        to: '2026-10-25'
        solver_status: OPTIMAL
        blocks:
          - index: 0
            kind: study
            todo_id: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
            title: Bài tập lớn CTDL
            start_at: '2026-10-24T09:30:00+07:00'
            end_at: '2026-10-24T11:00:00+07:00'
            predicted_kss: 3.6
            alertness_score: 68
        unscheduled: []
        stats:
          study_minutes: 90
          mean_predicted_kss: 3.6
          golden_hour_ratio: 1.0
          solve_ms: 140
        model:
          phi_hours: 18.5
          phi_sd_hours: 0.43
          chi_w_hours: 18.9
          chi_w_sd_hours: 0.8
          personalization_level: personalized
          kss_days: 14
    ScheduleApplyRequest:
      type: object
      required: [suggestion_id]
      properties:
        suggestion_id: { type: string, format: uuid }
        block_indexes:
          type: [array, 'null']
          items: { type: integer, minimum: 0 }
        sync_to_google: { type: boolean, default: false }
    ScheduleApplyResult:
      type: object
      required: [events, sync]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        sync:
          anyOf: [{ $ref: '#/components/schemas/SyncResult' }, { type: 'null' }]

    # ─────────── Google Calendar ───────────
    CalendarStatus:
      type: object
      required: [connected, google_email, calendar_id, two_way_sync, last_synced_at, pending_count,
                 conflict_count]
      properties:
        connected: { type: boolean }
        google_email: { type: [string, 'null'], format: email }
        calendar_id: { type: [string, 'null'], examples: [primary] }
        two_way_sync: { type: boolean }
        last_synced_at: { type: [string, 'null'], format: date-time }
        pending_count: { type: integer }
        conflict_count: { type: integer }
    CalendarSettingsUpdate:
      type: object
      minProperties: 1
      properties:
        calendar_id: { type: string, description: '`primary` or a calendar ID the user can write to.' }
        two_way_sync: { type: boolean }
    SyncRequest:
      type: object
      properties:
        event_ids:
          type: [array, 'null']
          items: { type: string, format: uuid }
          description: Only these events; `null` → all pending.
    SyncResult:
      type: object
      required: [pushed, pulled, failed, conflicts]
      properties:
        pushed: { type: integer }
        pulled: { type: integer, description: Changes imported from Google (two-way only). }
        failed: { type: integer }
        conflicts: { type: integer }
    GoogleEventSnapshot:
      type: object
      required: [title, description, location, start_at, end_at, updated_at]
      properties:
        title: { type: string }
        description: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SyncConflict:
      type: object
      required: [id, event_id, local, google, detected_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        local: { $ref: '#/components/schemas/Event' }
        google: { $ref: '#/components/schemas/GoogleEventSnapshot' }
        detected_at: { type: string, format: date-time }
    SyncConflictList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SyncConflict' }
    ConflictResolveRequest:
      type: object
      required: [keep]
      properties:
        keep: { type: string, enum: [local, google] }

    # ─────────── Reminders ───────────
    ReminderSettings:
      type: object
      required: [bedtime_reminder_enabled, bedtime_reminder_minutes_before, deadline_reminder_enabled,
                 deadline_reminder_hours_before, kss_prompt_enabled, kss_prompts_per_day,
                 kss_prompt_window, sleep_confirm_enabled, motivation_enabled, quiet_hours]
      properties:
        bedtime_reminder_enabled: { type: boolean, default: true }
        bedtime_reminder_minutes_before:
          type: integer
          minimum: 0
          maximum: 240
          default: 30
          description: Before tonight's `recommended_sleep_at` (H8 `projected_sleep`).
        deadline_reminder_enabled: { type: boolean, default: true }
        deadline_reminder_hours_before:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 168 }
          default: [24, 2]
        kss_prompt_enabled: { type: boolean, default: true }
        kss_prompts_per_day: { type: integer, minimum: 1, maximum: 6, default: 4 }
        kss_prompt_window:
          $ref: '#/components/schemas/ClockWindow'
          default: { start: '08:00', end: '23:00' }
        sleep_confirm_enabled: { type: boolean, default: true, description: Morning push to confirm last night's inferred sleep. }
        motivation_enabled: { type: boolean, default: true }
        quiet_hours:
          anyOf: [{ $ref: '#/components/schemas/ClockWindow' }, { type: 'null' }]
      example:
        bedtime_reminder_enabled: true
        bedtime_reminder_minutes_before: 30
        deadline_reminder_enabled: true
        deadline_reminder_hours_before: [24, 2]
        kss_prompt_enabled: true
        kss_prompts_per_day: 4
        kss_prompt_window: { start: '08:00', end: '23:00' }
        sleep_confirm_enabled: true
        motivation_enabled: true
        quiet_hours: { start: '23:00', end: '07:00' }
    DeviceRegister:
      type: object
      required: [fcm_token]
      properties:
        fcm_token: { type: string, maxLength: 512 }
        platform: { $ref: '#/components/schemas/DevicePlatform', default: android }
    Quote:
      type: object
      required: [text, author, source, context]
      properties:
        text: { type: string }
        author: { type: [string, 'null'] }
        source: { type: string, enum: [gemini, fallback] }
        context: { $ref: '#/components/schemas/QuoteContext' }
    PushPayload:
      type: object
      required: [type, title, body, deep_link]
      properties:
        type: { type: string, enum: [bedtime, deadline, kss_prompt, sleep_confirm, motivation, sync_conflict] }
        title: { type: string }
        body: { type: string }
        deep_link: { type: string, examples: ['recolly://kss', 'recolly://todos/<id>', 'recolly://sleep-logs/<id>'] }
        ref_id: { type: string, description: 'ID of the related todo / sleep log / conflict, if any.' }
        scheduled_for: { type: string, description: ISO datetime the reminder refers to (e.g. bedtime). }

    # ─────────── Home ───────────
    NowState:
      type: object
      required: [time, asleep, process_s, process_c, kss_pred, kss_lo, kss_hi, alertness_score]
      properties:
        time: { type: string, format: date-time }
        asleep: { type: boolean, description: True if the model expects the user to be asleep now. }
        process_s: { type: number }
        process_c: { type: number }
        kss_pred: { type: [number, 'null'] }
        kss_lo: { type: [number, 'null'] }
        kss_hi: { type: [number, 'null'] }
        alertness_score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
    HomeOverview:
      type: object
      required: [date, now, next_peak_window, tonight, today_events, upcoming_todos,
                 sleep_debt_7d_minutes, last_night, needs_sleep_confirmation, kss_checkin_due, model]
      properties:
        date: { type: string, format: date }
        now: { $ref: '#/components/schemas/NowState' }
        next_peak_window:
          anyOf: [{ $ref: '#/components/schemas/BiorhythmWindow' }, { type: 'null' }]
        tonight:
          anyOf: [{ $ref: '#/components/schemas/ProjectedSleep' }, { type: 'null' }]
        today_events:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Event' }
        upcoming_todos:
          type: array
          maxItems: 3
          description: Not done, nearest deadline first.
          items: { $ref: '#/components/schemas/Todo' }
        sleep_debt_7d_minutes: { type: integer, minimum: 0 }
        last_night:
          anyOf: [{ $ref: '#/components/schemas/SleepLog' }, { type: 'null' }]
        needs_sleep_confirmation: { type: boolean, description: '`last_night` is inferred and unconfirmed → show the 1-tap confirm card.' }
        kss_checkin_due: { type: boolean, description: No check-in in the last 3 awake hours. }
        model: { $ref: '#/components/schemas/ModelSummary' }

    # ─────────── System ───────────
    HealthStatus:
      type: object
      required: [status, db, redis, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db: { type: string, enum: [ok, down] }
        redis: { type: string, enum: [ok, down] }
        version: { type: string, examples: [1.0.0] }
