services:
  db:
    image: postgres:18
    container_name: recolly-db-container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: 
      - recolly-network
  server:
    build: ./server/
    container_name: recolly-server-container
    environment:
      POSTGRES_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports: 
      - "8765:8765"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
        - recolly-network
networks:
  recolly-network:
    driver: bridge


